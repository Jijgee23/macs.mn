# /etc/nginx/sites-available/macs.mn — HTTP only; `certbot --nginx` adds the 443 block.
server {
    listen 80;
    listen [::]:80;
    server_name www.macs.mn;
    return 301 https://macs.mn$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name macs.mn;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (don't append): the docs API rate-limits on the first X-Forwarded-For
        # entry, so a client-supplied value must never get through.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
